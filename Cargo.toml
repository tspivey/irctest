[package]
name = "irctest"
version = "0.1.0"
edition = "2024"

[dependencies]
wxdragon = "0.9"
prismer = { version = "0.1", features = ["static"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
irc-proto = { version = "1.1", default-features = false }
native-tls = "0.2"
tokio-native-tls = "0.3"
sha2 = "0.10"
base64 = "0.23"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[patch.crates-io]
wxdragon = { git = "https://github.com/AllenDang/wxDragon" }
wxdragon-sys = { git = "https://github.com/AllenDang/wxDragon" }

[build-dependencies]
embed-manifest = "1.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Controls_RichEdit", "Win32_UI_WindowsAndMessaging"] }
