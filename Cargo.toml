[package]
name = "irctest"
version = "0.1.0"
edition = "2024"

[dependencies]
wxdragon = "0.9"
prismer = { version = "0.1", features = ["static"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread"] }
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
irc = { version = "1.1", default-features = false, features = ["ctcp", "tls-native", "encoding"] }

[patch.crates-io]
wxdragon = { git = "https://github.com/AllenDang/wxDragon" }
wxdragon-sys = { git = "https://github.com/AllenDang/wxDragon" }

[build-dependencies]
embed-manifest = "1.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Controls_RichEdit", "Win32_UI_WindowsAndMessaging"] }
